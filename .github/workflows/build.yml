name: build-cards

on:
  push:
    branches: [main]
    # リール（reels/ と描き出しの仕組み）も含める。以前は weeks/ だけで、
    # リールをマージしても動画が Pages に出なかった
    paths:
      - 'weeks/**'
      - 'reels/**'
      - 'assets/**'
      - 'lib/**'
      - '.claude/agents/**'
      - 'template.html'
      - 'reel.html'
      - 'render.mjs'
      - 'render-reel.mjs'
      - 'build-status.mjs'
      - 'board.html'
      - 'guard-public.mjs'
      - 'package.json'
      - '.github/workflows/build.yml'
  schedule:
    # ボード（status.json）の数字と警告を新しくするため毎時動かす。
    # 他の定期実行（auto-publish は7分・auto-publish-reel は23分）と重ならないよう41分にした
    - cron: '41 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read          # 投稿系ワークフローの結果と、失敗したときの ❌ の行をボードに載せるため
  pull-requests: read    # 承認待ち（週次PR）をボードに載せるため

concurrency:
  group: pages
  # 途中で止めると動画のキャッシュが保存されず、次も最初から描き直しになる。最後まで走らせる
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # data ブランチ（数字・投稿の結果・受信箱の件数）。まだ無ければ空のまま進む
      - name: Fetch data branch (if any)
        run: |
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            git fetch --depth=1 origin data
            mkdir -p data
            git archive FETCH_HEAD | tar -x -C data
          else
            echo "data ブランチはまだありません。数字や受信箱の集計が始まると作られます"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: |
          npm install
          npx playwright install --with-deps chromium

      # ubuntu ランナーには ffmpeg が入っていない（9/23 以降のビルドがこれで全部落ちていた）
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      - name: Render cards
        run: npm run render

      # 描き出した動画を使い回す。1本あたり数分かかるので、変わっていないものは描き直さない。
      # 1本ずつの判定は render-reel.mjs がハッシュで行う
      - name: Restore rendered reels
        id: reels-cache
        uses: actions/cache/restore@v4
        with:
          path: dist/reels
          key: reels-${{ hashFiles('reels/**', 'reel.html', 'render-reel.mjs', 'lib/voice.mjs', 'assets/**') }}
          restore-keys: reels-

      # ずんだもんの声（VOICEVOX）。声を新しく作る必要があるときだけ立てる。
      # イメージは約2GBあるので、毎時のビルドで毎回取ってこないようにしている。
      # 版は固定する（版が変わると同じセリフでも声が変わり、描き直しになるため）
      - name: Start VOICEVOX (only when new voice lines are needed)
        run: |
          if [ "$(node render-reel.mjs --needs-voice)" = "yes" ]; then
            docker run -d --rm --name voicevox -p 50021:50021 voicevox/voicevox_engine:cpu-0.25.2
            for i in $(seq 1 90); do
              curl -fsS http://localhost:50021/version && echo " VOICEVOX is up" && break
              sleep 2
            done
          else
            echo "新しく作る声はありません。VOICEVOX は立てません"
          fi

      # Instagram は動画ファイルを直接受け取れず、公開URLを渡す方式なので、
      # ここで Pages に出しておかないと投稿できない
      - name: Render reels
        run: npm run reel

      - name: Save rendered reels
        if: steps.reels-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: dist/reels
          key: reels-${{ hashFiles('reels/**', 'reel.html', 'render-reel.mjs', 'lib/voice.mjs', 'assets/**') }}

      - name: Build status.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run status

      # 公開してはいけないもの（トークン・DMの本文や名前）が dist/ に混ざっていたら止める
      - name: Guard public output
        run: npm run guard

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
