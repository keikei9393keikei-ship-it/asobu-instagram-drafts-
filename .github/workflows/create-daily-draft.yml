name: Create daily ASOBU Instagram draft

on:
  schedule:
    - cron: "0 8 * * *"
      timezone: "Asia/Tokyo"
  workflow_dispatch:
    inputs:
      target_date:
        description: "下書きを作る日付（YYYY-MM-DD）。空欄なら日本時間の当日。"
        required: false
        type: string

permissions:
  contents: write

jobs:
  create-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create the day's draft files
        env:
          TARGET_DATE: ${{ inputs.target_date }}
        run: |
          if [ -n "$TARGET_DATE" ]; then
            python scripts/create_daily_draft.py --date "$TARGET_DATE"
          else
            python scripts/create_daily_draft.py
          fi

      - name: Commit the new draft
        run: |
          git add drafts/
          if git diff --cached --quiet; then
            echo "No new draft files to commit."
            exit 0
          fi
          git config user.name "ASOBU Draft Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: add daily Instagram draft"
          git push
