<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
  /* 月の活動日まとめリール（10月の活動日リールと同じ形式）。
     日付カード → カレンダー → マスコット → まとめ → Instagram の5場面。
     reels/<名前>.json に "template": "calendar.html" と書くと render-reel.mjs がこちらで撮る。
     動きは reel.html と同じく seek(t) の中で全部作る（CSSアニメーションは使わない） */
  *{box-sizing:border-box;margin:0;}
  body{background:#222;}
  #stage{width:1080px;height:1920px;position:relative;overflow:hidden;
    background:linear-gradient(180deg,#FCEDE6 0%,#F9D6C4 55%,#F4B08E 100%);
    font-family:"Zen Maru Gothic",sans-serif;
    --ink:#4A382A; --accent:#F0762B; --accent2:#E25C12; --brown:#5A3A2E; --sun:#E0455A; --sat:#3F6FC4;}

  .bgwrap{position:absolute;inset:-10%;}
  .rays{position:absolute;left:50%;top:40%;width:2800px;height:2800px;transform:translate(-50%,-50%);
    background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.40) 0deg 5deg,rgba(255,255,255,0) 5deg 13deg);}
  .glow{position:absolute;inset:0;background:radial-gradient(110% 60% at 50% 38%,rgba(255,248,242,.9) 0%,rgba(255,236,224,.3) 50%,rgba(240,160,120,.15) 100%);}
  .dots{position:absolute;inset:0;}
  .dots i{position:absolute;display:block;border-radius:50%;}
  .confetti{position:absolute;inset:0;opacity:0;}
  .confetti i{position:absolute;display:block;width:14px;height:30px;border-radius:4px;}
  .dim{position:absolute;inset:0;background:rgba(70,40,30,.38);opacity:0;}
  .dark{position:absolute;inset:0;background:rgba(35,22,18,.74);opacity:0;}
  .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:9;}
  /* 重なり順：場面 < マスコット < 暗幕 < 最後の Instagram 場面 < 透かし < 閃光 */
  .mascot{z-index:2;} .dark{z-index:3;} .scene[data-type="outro"]{z-index:4;} .wm{z-index:5;}

  .scene{position:absolute;inset:0;opacity:0;will-change:transform,opacity;}

  .tag{position:absolute;left:50%;top:210px;transform:translateX(-50%);background:var(--brown);color:#fff;
    font-weight:700;font-size:36px;letter-spacing:.1em;padding:12px 40px;border-radius:999px;white-space:nowrap;}
  .tag em{font-style:normal;opacity:.6;margin:0 16px;}

  /* 袋文字：白で縁取った層の上に塗りの層を重ねる（reel.html と同じ作り） */
  .ttl{position:absolute;left:0;right:0;text-align:center;font-weight:900;white-space:pre;line-height:1.18;}
  .ttl .ln{position:relative;display:block;}
  .ttl .stroke{display:block;-webkit-text-stroke:.17em #fff;color:#fff;
    filter:drop-shadow(0 10px 0 rgba(198,110,52,.30)) drop-shadow(0 18px 24px rgba(150,80,40,.22));}
  .ttl .fill{position:absolute;inset:0;color:var(--accent);}
  .ttl .ln.ink .fill{color:var(--brown);}

  /* 1枚目：日付カード */
  .card{position:absolute;left:110px;width:860px;height:140px;background:#fff;border:6px solid #F6B48C;border-radius:36px;
    box-shadow:0 12px 0 rgba(198,110,52,.20),0 20px 30px rgba(150,80,40,.14);display:flex;align-items:center;gap:40px;padding-left:22px;}
  .card .num{width:112px;height:112px;border-radius:50%;background:var(--accent);color:#fff;font-weight:900;font-size:62px;
    display:flex;align-items:center;justify-content:center;letter-spacing:-.02em;}
  .card .date{font-weight:900;font-size:70px;color:var(--brown);letter-spacing:.02em;}
  .wd{display:inline-flex;align-items:center;justify-content:center;width:64px;height:64px;border-radius:50%;color:#fff;
    font-weight:900;font-size:38px;background:var(--sun);}
  .wd.sat{background:var(--sat);}

  /* 2枚目：カレンダー */
  .cal{position:absolute;left:60px;top:520px;width:960px;background:rgba(255,250,246,.95);border-radius:34px;overflow:visible;
    box-shadow:0 16px 36px rgba(80,40,20,.25);}
  .cal .hd{height:92px;background:var(--brown);border-radius:34px 34px 0 0;display:grid;grid-template-columns:repeat(7,1fr);
    align-items:center;color:#fff;font-weight:700;font-size:38px;text-align:center;}
  .cal .hd span:first-child{color:#FFB0B8;} .cal .hd span:last-child{color:#B9CCF2;}
  .cal .grid{position:relative;height:750px;}
  .cal .d{position:absolute;width:137px;height:150px;display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:44px;color:var(--ink);}
  .cal .d.sun{color:var(--sun);} .cal .d.sat{color:var(--sat);}
  .cal .row{position:absolute;left:24px;right:24px;height:2px;background:rgba(90,58,46,.10);}
  .mark{position:absolute;width:122px;height:122px;border-radius:50%;background:var(--accent);color:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:50px;line-height:1;
    box-shadow:0 8px 0 rgba(190,90,30,.25);}
  .mark small{font-size:22px;background:#fff;color:var(--accent2);border-radius:99px;padding:3px 12px;margin-top:6px;}
  .ring{position:absolute;width:122px;height:122px;border-radius:50%;border:8px solid #fff;opacity:0;}
  .lbl{position:absolute;background:var(--accent);color:#fff;font-weight:900;font-size:44px;padding:12px 30px;border-radius:999px;
    white-space:nowrap;box-shadow:0 8px 0 rgba(190,90,30,.28);}

  /* 4枚目：まとめ */
  .circ{position:absolute;width:170px;height:170px;border-radius:50%;background:var(--accent);color:#fff;font-weight:900;font-size:84px;
    display:flex;align-items:center;justify-content:center;box-shadow:0 10px 0 rgba(190,90,30,.25);letter-spacing:-.03em;}
  .circ .wd{position:absolute;bottom:-38px;left:50%;transform:translateX(-50%);width:58px;height:58px;font-size:34px;border:4px solid #fff;}
  .box{position:absolute;left:150px;width:780px;top:1200px;background:#fff;border:7px solid var(--accent);border-radius:40px;
    padding:22px 44px 26px;box-shadow:0 12px 0 rgba(198,110,52,.22);}
  .box .p{font-weight:700;font-size:42px;color:var(--ink);display:flex;align-items:center;gap:12px;}
  .box .p svg{width:40px;height:48px;}
  .box .b{font-weight:900;font-size:56px;color:var(--ink);margin-top:2px;}
  .box .b strong{color:var(--accent2);font-size:96px;margin-right:18px;letter-spacing:.02em;}
  .small{position:absolute;left:0;right:0;text-align:center;font-weight:700;font-size:38px;color:var(--brown);}
  .sub{position:absolute;left:0;right:0;text-align:center;font-weight:900;font-size:50px;color:var(--brown);letter-spacing:.06em;}

  /* 5枚目：Instagram */
  .ig{position:absolute;left:50%;top:640px;width:190px;height:190px;transform:translateX(-50%);}
  .handle{position:absolute;left:0;right:0;top:865px;text-align:center;color:#fff;font-weight:900;font-size:58px;letter-spacing:.04em;text-shadow:0 4px 14px rgba(0,0,0,.45);}
  .follow{position:absolute;left:0;right:0;top:955px;text-align:center;color:#fff;font-weight:700;font-size:44px;text-shadow:0 4px 14px rgba(0,0,0,.45);}

  .wm{position:absolute;display:flex;flex-direction:column;align-items:center;gap:6px;color:rgba(255,255,255,.9);
    font-weight:700;font-size:22px;letter-spacing:.04em;opacity:0;}
  .wm svg{width:46px;height:46px;}

  .mascot{position:absolute;transform-origin:50% 100%;}
  .mascot img{width:100%;display:block;filter:drop-shadow(0 14px 18px rgba(120,60,30,.20));}
</style>
</head>
<body>
<div id="stage">
  <div class="bgwrap" id="bg"><div class="rays" id="rays"></div><div class="glow"></div></div>
  <div class="dots" id="dots"></div>
  <div class="confetti" id="confetti"></div>
  <div class="dim" id="dim"></div>
  <div id="scenes"></div>
  <div class="mascot" id="mascot"><img src="assets/mascot.png" alt=""></div>
  <div class="dark" id="dark"></div>
  <div id="top"></div>
  <div class="wm" id="wm"></div>
  <div class="flash" id="flash"></div>
</div>
<script>
const clamp01 = (x) => Math.max(0, Math.min(1, x));
const lerp = (a, b, p) => a + (b - a) * p;
const easeOut = (p) => 1 - Math.pow(1 - p, 3);
const easeInOut = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
const easeBack = (p) => { const c = 1.7; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
const WD = ['日', '月', '火', '水', '木', '金', '土'];
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

// Instagram の形（角丸の四角＋丸＋点）。色は stroke で決める
const igSvg = (stroke, w) => `<svg viewBox="0 0 100 100"><rect x="${w/2+4}" y="${w/2+4}" width="${92-w}" height="${92-w}" rx="26" fill="none" stroke="${stroke}" stroke-width="${w}"/>`
  + `<circle cx="50" cy="50" r="19" fill="none" stroke="${stroke}" stroke-width="${w}"/><circle cx="74" cy="26" r="${w*0.55}" fill="${stroke}"/></svg>`;
const pinSvg = `<svg viewBox="0 0 40 48"><path d="M20 2C10 2 3 9.5 3 19c0 12 17 27 17 27s17-15 17-27C37 9.5 30 2 20 2z" fill="#E0455A"/><circle cx="20" cy="18" r="7" fill="#fff"/></svg>`;

/** 袋文字。行ごとに .ln で包む（行ごとにずらして出すため）。dark=true の行は焦茶で塗る */
function title(text, size, top, darkLines = []) {
  const lines = String(text).split('\n');
  return `<div class="ttl" style="font-size:${size}px;top:${top}px">` + lines.map((l, i) =>
    `<span class="ln${darkLines.includes(i) ? ' ink' : ''}"><span class="stroke">${esc(l)}</span><span class="fill">${esc(l)}</span></span>`).join('') + `</div>`;
}

let SC = [], SPEC = {}, CAL = {};

window.renderReel = function (scenes, foot, spec) {
  SC = scenes; SPEC = spec || {};
  const { year, month, dates = [] } = SPEC;
  const first = new Date(year, month - 1, 1).getDay();
  const days = new Date(year, month, 0).getDate();
  const wdOf = (d) => (first + d - 1) % 7;
  const tag = `<div class="tag">遊部<em>|</em>ASOBU</div>`;
  const wdBadge = (d) => `<span class="wd${wdOf(d) === 6 ? ' sat' : ''}">${WD[wdOf(d)]}</span>`;

  // 背景の水玉（位置は固定の擬似乱数で決める）
  let seed = 7; const rnd = () => ((seed = (seed * 9301 + 49297) % 233280) / 233280);
  const dots = document.getElementById('dots');
  dots.innerHTML = Array.from({ length: 26 }, () => {
    const s = 8 + rnd() * 14, c = rnd() < .5 ? '#F0762B' : '#fff';
    return `<i style="left:${rnd()*1080}px;top:${rnd()*1920}px;width:${s}px;height:${s}px;background:${c};opacity:${.45 + rnd()*.4}" data-v="${rnd()}"></i>`;
  }).join('');
  const conf = document.getElementById('confetti');
  const cols = ['#F0762B', '#F6C445', '#E0455A', '#5BB6E8', '#fff', '#8BCB6B'];
  conf.innerHTML = Array.from({ length: 46 }, (_, i) =>
    `<i style="background:${cols[i % cols.length]}" data-x="${rnd()*1080}" data-y="${rnd()*900 - 200}" data-s="${.6 + rnd()*.8}" data-r="${rnd()*360}"></i>`).join('');

  const root = document.getElementById('scenes');
  root.innerHTML = '';
  scenes.forEach((s, i) => {
    const el = document.createElement('div');
    el.className = 'scene'; el.dataset.i = i; el.dataset.type = s.type;
    if (s.type === 'list') {
      el.innerHTML = tag + title(SPEC.title, 124, 300) + dates.map((d, k) =>
        `<div class="card" style="top:${520 + k * 162}px"><div class="num">${d}</div><div class="date">${month}月${d}日</div>${wdBadge(d)}</div>`).join('');
    } else if (s.type === 'calendar') {
      const cw = 137, rh = 150, ox = 0;
      const rows = Math.ceil((first + days) / 7);
      let cells = '';
      for (let r = 1; r < rows; r++) cells += `<div class="row" style="top:${r * rh}px"></div>`;
      for (let d = 1; d <= days; d++) {
        const c = wdOf(d), r = Math.floor((first + d - 1) / 7);
        if (dates.includes(d)) continue;
        cells += `<div class="d${c === 0 ? ' sun' : c === 6 ? ' sat' : ''}" style="left:${ox + c * cw}px;top:${r * rh}px">${d}</div>`;
      }
      const marks = dates.map((d, k) => {
        const c = wdOf(d), r = Math.floor((first + d - 1) / 7);
        const x = c * cw + (cw - 122) / 2, y = r * rh + (rh - 122) / 2;
        // 札は丸の右に出す（右端に寄った日は左に出す）
        const right = c <= 3;
        return `<div class="ring" data-k="${k}" style="left:${x}px;top:${y}px"></div>`
          + `<div class="mark" data-k="${k}" style="left:${x}px;top:${y}px">${d}<small>活動</small></div>`
          + `<div class="lbl" data-k="${k}" data-right="${right ? 1 : 0}" style="${right ? `left:${x + 140}px` : `right:${(6 - c) * cw + cw - 10}px`};top:${y + 26}px">${k + 1}回目 ${month}/${d}(${WD[c]})</div>`;
      }).join('');
      CAL = { rows };
      el.innerHTML = tag + title('カレンダーでチェック！', 88, 330, [0])
        + `<div class="cal" style="height:${92 + rows * rh}px"><div class="hd">${WD.map((w) => `<span>${w}</span>`).join('')}</div>`
        + `<div class="grid" style="height:${rows * rh}px">${cells}${marks}</div></div>`;
    } else if (s.type === 'cheer') {
      el.innerHTML = title(s.head, 136, 290, [1]) + `<div class="sub" style="top:1330px">${esc(s.sub || '')}</div>`;
    } else if (s.type === 'summary') {
      const n = dates.length, w = 170, gap = n > 4 ? 22 : 60;
      const x0 = (1080 - (n * w + (n - 1) * gap)) / 2;
      el.innerHTML = tag + title(SPEC.title, 124, 300)
        + dates.map((d, k) => `<div class="circ" data-k="${k}" style="left:${x0 + k * (w + gap)}px;top:520px">${d}${wdBadge(d)}</div>`).join('')
        + title(s.head, 92, 1040, [0])
        + `<div class="box"><div class="p">${pinSvg}${esc(s.place)}</div><div class="b"><strong>DM</strong>${esc(s.dm)}</div></div>`
        + `<div class="small" style="top:1490px">${esc(s.small || '')}</div>`;
    } else if (s.type === 'outro') {
      el.innerHTML = `<div class="ig" id="igbig"></div><div class="handle">${esc(s.handle)}</div><div class="follow">${esc(s.small || '')}</div>`;
    }
    root.appendChild(el);
  });
  document.getElementById('wm').innerHTML = igSvg('rgba(255,255,255,.92)', 9) + `<span>${esc(SPEC.handle || '')}</span>`;
  seek(0);
};

/** 時刻 t の絵を作る。同じ t なら必ず同じ絵になる */
window.seek = function (t) {
  const IN = 0.35, OUT = 0.3;
  let cur = 0;
  SC.forEach((s, i) => { if (t >= s.t) cur = i; });
  const total = SC.reduce((e, s) => Math.max(e, s.t + s.d), 0);

  // 背景：ゆっくり回して寄せる。水玉はふわふわ上下する
  document.getElementById('rays').style.transform = `translate(-50%,-50%) rotate(${t * 3}deg)`;
  document.getElementById('bg').style.transform = `scale(${1 + 0.04 * (t / total)})`;
  document.querySelectorAll('#dots i').forEach((d, k) => {
    const v = +d.dataset.v;
    d.style.transform = `translateY(${Math.sin(t * (0.8 + v) + k) * 14}px)`;
  });

  // 暗幕：カレンダーの間は薄く、最後の Instagram は濃く
  const cal = SC.findIndex((s) => s.type === 'calendar');
  const outro = SC.findIndex((s) => s.type === 'outro');
  let dim = 0;
  if (cal >= 0) {
    const s = SC[cal], l = t - s.t;
    dim = clamp01(l / 0.4) * (1 - clamp01((l - s.d + 0.3) / 0.3));
  }
  document.getElementById('dim').style.opacity = dim;
  let dark = 0;
  if (outro >= 0) dark = easeOut(clamp01((t - SC[outro].t) / 0.45));
  document.getElementById('dark').style.opacity = dark;

  SC.forEach((s, i) => {
    const el = document.querySelector(`.scene[data-i="${i}"]`);
    const l = t - s.t;
    // まとめの場面は、最後の Instagram の下にそのまま残す（暗幕ごしに見える）
    const keep = s.type === 'summary' && outro === i + 1;
    const end = keep ? total : s.t + s.d;
    if (t < s.t - 0.01 || t > end + 0.01) { el.style.opacity = 0; return; }
    const ein = easeOut(clamp01(l / IN));
    const eout = keep ? 0 : easeInOut(clamp01((l - (s.d - OUT)) / OUT));
    el.style.opacity = ein * (1 - eout);
    el.style.transform = `scale(${lerp(1.04, 1, ein) * lerp(1, 0.97, eout)})`;

    // 見出しは行ごとに下から弾んで出す
    el.querySelectorAll('.ttl').forEach((tt, ti) => {
      tt.querySelectorAll('.ln').forEach((ln, k) => {
        const e = easeBack(clamp01((l - 0.05 - ti * 0.5 - k * 0.14) / 0.4));
        ln.style.opacity = clamp01(e * 1.4);
        ln.style.transform = `translateY(${(1 - e) * 60}px) scale(${lerp(0.85, 1, e)})`;
      });
    });

    if (s.type === 'list') {
      el.querySelectorAll('.card').forEach((c, k) => {
        const e = easeBack(clamp01((l - 0.35 - k * 0.2) / 0.45));
        c.style.opacity = clamp01(e * 1.5);
        c.style.transform = `translateX(${(1 - e) * -700}px) rotate(${(1 - e) * -4}deg)`;
      });
    }
    if (s.type === 'calendar') {
      const n = el.querySelectorAll('.mark').length;
      const start = 0.7, step = Math.max(0.6, (s.d - start - 0.5) / Math.max(1, n));
      el.querySelectorAll('.mark').forEach((m) => {
        const k = +m.dataset.k, lk = l - start - k * step;
        const e = easeBack(clamp01(lk / 0.35));
        m.style.opacity = clamp01(e * 1.5);
        m.style.transform = `scale(${lerp(0.3, 1, e) * (1 + 0.12 * Math.max(0, 1 - Math.abs(lk - 0.3) / 0.3))})`;
        const ring = el.querySelector(`.ring[data-k="${k}"]`);
        const rp = clamp01(lk / 0.7);
        ring.style.opacity = lk > 0 ? (1 - rp) * 0.9 : 0;
        ring.style.transform = `scale(${1 + rp * 0.8})`;
        const lbl = el.querySelector(`.lbl[data-k="${k}"]`);
        const on = lk >= 0 && (k === n - 1 || lk < step);
        const le = easeBack(clamp01(lk / 0.3)) * (k === n - 1 ? 1 : 1 - clamp01((lk - step + 0.15) / 0.15));
        lbl.style.opacity = on ? clamp01(le * 1.4) : 0;
        lbl.style.transform = `translateX(${(1 - le) * (lbl.dataset.right === '1' ? -30 : 30)}px) scale(${lerp(0.7, 1, le)})`;
      });
    }
    if (s.type === 'summary') {
      el.querySelectorAll('.circ').forEach((c) => {
        const k = +c.dataset.k;
        const e = easeBack(clamp01((l - 0.35 - k * 0.12) / 0.4));
        c.style.opacity = clamp01(e * 1.5);
        c.style.transform = `translateY(${(1 - e) * 80}px) scale(${lerp(0.4, 1, e)})`;
      });
      const box = el.querySelector('.box');
      const be = easeBack(clamp01((l - 1.15) / 0.4));
      box.style.opacity = clamp01(be * 1.5);
      box.style.transform = `translateY(${(1 - be) * 50}px) scale(${lerp(0.9, 1, be)})`;
      const sm = el.querySelector('.small');
      sm.style.opacity = easeOut(clamp01((l - 1.5) / 0.4));
    }
    if (s.type === 'cheer') {
      const sub = el.querySelector('.sub');
      const e = easeOut(clamp01((l - 0.9) / 0.4));
      sub.style.opacity = e; sub.style.transform = `translateY(${(1 - e) * 30}px)`;
    }
    if (s.type === 'outro') {
      const ig = el.querySelector('.ig');
      const e = easeBack(clamp01((l - 0.15) / 0.45));
      ig.style.transform = `translateX(-50%) scale(${lerp(0.3, 1, e)})`;
      // 白い線 → 少しして色つきに切り替える（10月版と同じ見せ方）
      const colored = Math.floor((l - 1.1) / 0.8) % 2 === 0 && l > 1.1;
      ig.innerHTML = colored
        ? `<svg viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#FEC053"/><stop offset=".45" stop-color="#F2203E"/><stop offset="1" stop-color="#7A2CD6"/></linearGradient></defs>`
          + `<rect x="8" y="8" width="84" height="84" rx="24" fill="#fff"/><rect x="12" y="12" width="76" height="76" rx="22" fill="none" stroke="url(#g)" stroke-width="9"/>`
          + `<circle cx="50" cy="50" r="18" fill="none" stroke="url(#g)" stroke-width="9"/><circle cx="72" cy="28" r="5" fill="url(#g)"/></svg>`
        : igSvg('#fff', 9);
      const h = el.querySelector('.handle'), f = el.querySelector('.follow');
      const he = easeOut(clamp01((l - 0.45) / 0.4));
      h.style.opacity = he; h.style.transform = `translateY(${(1 - he) * 30}px)`;
      f.style.opacity = easeOut(clamp01((l - 0.8) / 0.4));
    }
  });

  // マスコット：場面ごとに置き場所と大きさを変え、そのあいだは滑らかに移す
  const POS = {
    list: { x: 800, y: 1660, w: 230 }, calendar: { x: 880, y: 1640, w: 200 },
    cheer: { x: 540, y: 1270, w: 560 }, summary: { x: 540, y: 1010, w: 220 }, outro: { x: 540, y: 1010, w: 220 },
  };
  const s0 = SC[cur], p0 = POS[s0.type] || POS.list;
  const prev = cur > 0 ? (POS[SC[cur - 1].type] || POS.list) : p0;
  const mp = easeInOut(clamp01((t - s0.t) / 0.45));
  const x = lerp(prev.x, p0.x, mp), y = lerp(prev.y, p0.y, mp), w = lerp(prev.w, p0.w, mp);
  const hop = Math.max(0, Math.sin(clamp01((t - s0.t) / 0.5) * Math.PI)) * (s0.type === 'cheer' ? 70 : 30);
  const bob = Math.sin(t * 3.2) * 8;
  const m = document.getElementById('mascot');
  const appear = easeBack(clamp01((t - 0.6) / 0.5));
  m.style.width = `${w}px`;
  m.style.left = `${x - w / 2}px`;
  m.style.top = `${y - w * 1.1}px`;
  m.style.opacity = clamp01(appear * 1.4);
  m.style.transform = `translateY(${-hop + bob}px) scale(${lerp(0.4, 1, appear)}) rotate(${Math.sin(t * 2.4) * 3}deg)`;

  // 紙ふぶき：マスコットの場面で上から降らせる
  const ch = SC.findIndex((s) => s.type === 'cheer');
  const conf = document.getElementById('confetti');
  if (ch >= 0) {
    const l = t - SC[ch].t, d = SC[ch].d;
    conf.style.opacity = l < 0 || l > d + 0.4 ? 0 : clamp01(l / 0.2) * (1 - clamp01((l - d) / 0.4));
    conf.querySelectorAll('i').forEach((c, k) => {
      const sp = +c.dataset.s;
      c.style.left = `${+c.dataset.x + Math.sin(l * 2 + k) * 40}px`;
      c.style.top = `${+c.dataset.y + Math.max(0, l) * 420 * sp}px`;
      c.style.transform = `rotate(${+c.dataset.r + l * 260 * sp}deg) scale(${sp})`;
    });
  }

  // 白い閃光：fx:"flash" の場面のピーク（場面開始 +0.30秒。render-reel-se.mjs の chime と同じ時刻）
  let fl = 0;
  SC.forEach((s) => { if (s.fx === 'flash') { const l = t - s.t; if (l >= 0 && l < 0.7) fl = l < 0.3 ? l / 0.3 * 0.75 : 0.75 * (1 - (l - 0.3) / 0.4); } });
  document.getElementById('flash').style.opacity = fl;

  // 透かしの @アカウント。場面ごとに位置を変える（最後の場面では大きく出すので消す）
  const WM = { list: [900, 440], calendar: [900, 440], cheer: [150, 980], summary: [150, 780] };
  const wm = document.getElementById('wm');
  const wp = WM[s0.type];
  if (!wp || !SPEC.handle) { wm.style.opacity = 0; }
  else {
    wm.style.opacity = 0.85 * clamp01((t - s0.t - 0.3) / 0.3) * (1 - clamp01((t - (s0.t + s0.d - 0.25)) / 0.25));
    wm.style.left = `${wp[0] - 110}px`; wm.style.top = `${wp[1]}px`; wm.style.width = '220px';
  }
};
</script>
</body>
